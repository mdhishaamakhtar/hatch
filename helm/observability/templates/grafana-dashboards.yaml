# One ConfigMap per dashboard in dashboards/. Grafana's sidecar imports every
# ConfigMap labelled grafana_dashboard, into the folder its grafana_folder
# annotation names.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hatch-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: hatch
  annotations:
    grafana_folder: Hatch
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
