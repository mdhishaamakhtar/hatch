# One broker, in KRaft mode, that is also its own controller.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: kafka}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/component: kafka}
  ports:
    - {name: broker, port: {{ .Values.kafka.port }}, targetPort: broker}
    - {name: controller, port: {{ .Values.kafka.controllerPort }}, targetPort: controller}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: kafka}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: kafka}
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - {name: broker, containerPort: {{ .Values.kafka.port }}}
            - {name: controller, containerPort: {{ .Values.kafka.controllerPort }}}
          env:
            - {name: CLUSTER_ID, value: {{ .Values.kafka.clusterID | quote }}}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:{{ .Values.kafka.port }},CONTROLLER://:{{ .Values.kafka.controllerPort }}"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.kafka.port }}"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.kafka.controllerPort }}"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
          readinessProbe:
            tcpSocket: {port: broker}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/part-of: hatch}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.kafka.storage }}}
{{- if .Values.jobs.enabled }}
---
# Creates the topics, leaving any that already exist as they are.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: kafka-topics}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: kafka-topics}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: {{ .Values.kafka.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              broker=kafka:{{ .Values.kafka.port }}
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$broker" >/dev/null 2>&1; do
                echo "waiting for $broker"
                sleep 2
              done
              {{- range .Values.kafka.topics }}
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$broker" --create --if-not-exists \
                --topic {{ . }} --partitions {{ $.Values.kafka.partitions }} --replication-factor 1
              {{- end }}
{{- end }}
