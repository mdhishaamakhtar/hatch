apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: redis}
spec:
  selector: {app.kubernetes.io/component: redis}
  ports:
    - {name: redis, port: {{ .Values.redis.port }}, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: redis}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: redis}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes"]
          ports:
            - {name: redis, containerPort: {{ .Values.redis.port }}}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/part-of: hatch}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.redis.storage }}}
