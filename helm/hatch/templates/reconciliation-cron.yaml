{{- if .Values.services.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-cron
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: reconciliation-cron}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: reconciliation-cron}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: reconciliation-cron}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.reconciliationCron.port | quote }}
    spec:
      initContainers:
        {{- include "hatch.waitFor" (list . "postgres" "kafka") | nindent 8 }}
      containers:
        - name: reconciliation-cron
          image: {{ index .Values.images "reconciliation-cron" }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: {{ .Values.reconciliationCron.port }}}
          envFrom:
            - secretRef: {name: hatch-secrets}
          env:
            - {name: PORT, value: {{ .Values.reconciliationCron.port | quote }}}
            - {name: RECON_INTERVAL, value: {{ .Values.reconciliationCron.interval | quote }}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
{{- end }}
