{{- if .Values.services.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-worker
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: delivery-worker}
spec:
  replicas: {{ .Values.deliveryWorker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: delivery-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: delivery-worker}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.deliveryWorker.port | quote }}
    spec:
      initContainers:
        {{- include "hatch.waitFor" (list . "postgres" "redis" "kafka") | nindent 8 }}
      containers:
        - name: delivery-worker
          image: {{ index .Values.images "delivery-worker" }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: {{ .Values.deliveryWorker.port }}}
          envFrom:
            - secretRef: {name: hatch-secrets}
          env:
            - {name: PORT, value: {{ .Values.deliveryWorker.port | quote }}}
            - {name: MOCK_PROVIDER_FAIL_RECIPIENT, value: {{ .Values.deliveryWorker.failRecipient | quote }}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
{{- end }}
