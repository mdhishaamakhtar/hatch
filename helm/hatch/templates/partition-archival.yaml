{{- if .Values.services.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partition-archival
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: partition-archival}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: partition-archival}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: partition-archival}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.partitionArchival.port | quote }}
    spec:
      # Lets the image's nonroot user write to the archive volume.
      securityContext: {fsGroup: 65532}
      initContainers:
        {{- include "hatch.waitFor" (list . "postgres") | nindent 8 }}
      containers:
        - name: partition-archival
          image: {{ index .Values.images "partition-archival" }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: {{ .Values.partitionArchival.port }}}
          envFrom:
            - secretRef: {name: hatch-secrets}
          env:
            - {name: PORT, value: {{ .Values.partitionArchival.port | quote }}}
            - {name: ARCHIVAL_INTERVAL, value: {{ .Values.partitionArchival.interval | quote }}}
            - {name: ARCHIVE_DIR, value: /archive}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: archive, mountPath: /archive}
      volumes:
        # Where exports land. Anywhere real, this would be durable storage.
        - {name: archive, emptyDir: {}}
{{- end }}
