{{- if .Values.jobs.enabled }}
# Migrates the database. Helm cannot read files outside the chart, so
# scripts/sync-migrations.sh puts migrations/ in the hatch-migrations ConfigMap
# first.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: db-migrate}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: db-migrate}
    spec:
      restartPolicy: OnFailure
      initContainers:
        {{- include "hatch.waitFor" (list . "postgres") | nindent 8 }}
      containers:
        - name: migrate
          image: {{ .Values.migrations.image }}
          args: ["-path", "/migrations", "-database", "$(DATABASE_URL)", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: hatch-secrets, key: DATABASE_URL}
          volumeMounts:
            - {name: migrations, mountPath: /migrations}
      volumes:
        - name: migrations
          configMap: {name: hatch-migrations}
{{- end }}
