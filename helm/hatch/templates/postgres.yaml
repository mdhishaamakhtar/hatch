apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: postgres}
spec:
  selector: {app.kubernetes.io/component: postgres}
  ports:
    - {name: postgres, port: {{ .Values.postgres.port }}, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # scheduled_emails has 1,200 partitions, and a statement that touches
          # all of them takes a lock on each.
          args: ["-c", "max_locks_per_transaction=2048"]
          ports:
            - {name: postgres, containerPort: {{ .Values.postgres.port }}}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: hatch-secrets, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -U, {{ .Values.postgres.user }}]}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/part-of: hatch}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
