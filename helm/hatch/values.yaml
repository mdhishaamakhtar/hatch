# `make up` installs this chart in three passes: the infrastructure alone, then
# the jobs that migrate the database and create the topics, then the services.
services:
  enabled: true
jobs:
  enabled: true

# Set by `make up-pods` to the tags `make build` gave each image.
images:
  api: hatch/api:dev
  scheduler: hatch/scheduler:dev
  delivery-worker: hatch/delivery-worker:dev
  retry-consumer: hatch/retry-consumer:dev
  reconciliation-cron: hatch/reconciliation-cron:dev
  partition-archival: hatch/partition-archival:dev

api:
  replicas: 1
  port: 9021

scheduler:
  replicas: 2
  port: 9022
  wheelStorage: 1Gi

deliveryWorker:
  replicas: 1
  port: 9023
  # Sends to this recipient always fail, which is how `make verify` drives a
  # schedule through every retry tier.
  failRecipient: fail@mock.test

retryConsumer:
  replicas: 1
  port: 9024
  # Seconds instead of the default 1m,5m,30m, so retries come round quickly
  # in development.
  intervals: 2s,4s,8s

# The crons sweep when they start. `make verify` runs sweeps of its own, so
# in development they need not sweep often.
reconciliationCron:
  port: 9025
  interval: 1h

partitionArchival:
  port: 9026
  interval: 1h

postgres:
  image: postgres:17-alpine
  database: hatch
  user: hatch
  storage: 5Gi
  port: 5432

redis:
  image: redis:7-alpine
  storage: 1Gi
  port: 6379

kafka:
  image: apache/kafka:3.9.0
  storage: 5Gi
  port: 9092
  controllerPort: 9093
  clusterID: 5L6g3nShT-eMCtK--X86sw
  partitions: 12
  topics:
    - emails.due
    - emails.retry.1min
    - emails.retry.5min
    - emails.retry.30min

migrations:
  image: migrate/migrate:v4.18.3

# The image of the init containers that hold a service back until its
# dependencies accept connections. busybox has nc.
waitImage: busybox:1.36
