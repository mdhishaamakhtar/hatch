basePath: /
definitions:
  ErrorBody:
    properties:
      error:
        type: string
      reason:
        type: string
    type: object
  createClientRequest:
    properties:
      max_rps:
        description: defaults to 100
        type: integer
      name:
        type: string
    type: object
  createClientResponse:
    properties:
      api_key:
        type: string
      client_id:
        type: string
      max_rps:
        type: integer
      name:
        type: string
    type: object
  createScheduleRequest:
    properties:
      body:
        type: string
      deliver_at:
        description: Unix milliseconds
        type: integer
      from_email:
        type: string
      from_name:
        type: string
      idempotency_key:
        type: string
      metadata:
        items:
          type: integer
        type: array
      recipient_email:
        type: string
      subject:
        type: string
    type: object
  scheduleDetail:
    properties:
      body:
        type: string
      created_at:
        type: string
      deliver_at:
        type: integer
      failure_reason:
        type: string
      from_email:
        type: string
      from_name:
        type: string
      idempotency_key:
        type: string
      last_provider:
        type: string
      metadata:
        items:
          type: integer
        type: array
      recipient_email:
        type: string
      retry_count:
        type: integer
      schedule_id:
        type: string
      status:
        type: string
      subject:
        type: string
      updated_at:
        type: string
    type: object
  scheduleResponse:
    properties:
      deliver_at:
        type: integer
      schedule_id:
        type: string
      status:
        type: string
    type: object
  upsertProviderRequest:
    properties:
      credentials:
        type: object
      vendor:
        enum:
        - mock
        - resend
        type: string
    type: object
  upsertProviderResponse:
    properties:
      client_id:
        type: string
      is_active:
        type: boolean
      provider_id:
        type: string
      vendor:
        type: string
    type: object
host: localhost:9021
info:
  contact: {}
  description: Schedule emails for future delivery. Admin endpoints provision clients
    and their providers' credentials.
  title: Hatch Scheduler API
  version: "1.0"
paths:
  /admin/clients:
    post:
      consumes:
      - application/json
      parameters:
      - description: The client
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/createClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a client
      tags:
      - admin
  /admin/clients/{client_id}:
    delete:
      parameters:
      - description: Client id
        in: path
        name: client_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete a client
      tags:
      - admin
  /admin/clients/{client_id}/providers:
    post:
      consumes:
      - application/json
      parameters:
      - description: Client id
        in: path
        name: client_id
        required: true
        type: string
      - description: Vendor and credentials, such as an api_key for resend
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/upsertProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/upsertProviderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorBody'
      security:
      - BearerAuth: []
      summary: Register a client's provider
      tags:
      - admin
  /admin/clients/{client_id}/providers/{vendor}:
    delete:
      parameters:
      - description: Client id
        in: path
        name: client_id
        required: true
        type: string
      - description: Vendor
        enum:
        - mock
        - resend
        in: path
        name: vendor
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete a client's provider
      tags:
      - admin
  /v1/schedules:
    post:
      consumes:
      - application/json
      parameters:
      - description: The email and when to send it
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Idempotent replay
          schema:
            $ref: '#/definitions/scheduleResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/scheduleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorBody'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorBody'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/ErrorBody'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorBody'
      security:
      - BearerAuth: []
      summary: Schedule an email
      tags:
      - schedules
  /v1/schedules/{schedule_id}:
    delete:
      parameters:
      - description: Schedule id
        in: path
        name: schedule_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorBody'
        "409":
          description: Already delivered, failed or cancelled
          schema:
            $ref: '#/definitions/ErrorBody'
      security:
      - BearerAuth: []
      summary: Cancel a schedule
      tags:
      - schedules
    get:
      parameters:
      - description: Schedule id
        in: path
        name: schedule_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scheduleDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorBody'
      security:
      - BearerAuth: []
      summary: Get a schedule
      tags:
      - schedules
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: '"Bearer <api_key>": a client''s key for /v1, the admin key for /admin.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
