# One benchmark run, applied by scripts/bench.sh with the ${...} filled in.
# It runs in the cluster so a run lasting tens of minutes never depends on a
# port-forward staying up.
apiVersion: batch/v1
kind: Job
metadata:
  name: hatch-bench
  namespace: hatch
  labels:
    app.kubernetes.io/part-of: hatch
    app.kubernetes.io/component: bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: hatch
        app.kubernetes.io/component: bench
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ${BENCH_IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: hatch-secrets
          env:
            - name: BENCH_SCENARIO
              value: "${BENCH_SCENARIO}"
            - name: BENCH_COUNT
              value: "${BENCH_COUNT}"
            - name: BENCH_WORKERS
              value: "${BENCH_WORKERS}"
            - name: BENCH_SPREAD
              value: "${BENCH_SPREAD}"
            - name: BENCH_LABEL
              value: "${BENCH_LABEL}"
            - name: SCHEDULER_REPLICAS
              value: "${SCHEDULER_REPLICAS}"
            - name: BENCH_SCHEDULE_LEAD
              value: "${BENCH_SCHEDULE_LEAD}"
            - name: BENCH_GIT_COMMIT
              value: "${BENCH_GIT_COMMIT}"
            - name: BENCH_REPLICAS
              value: "${BENCH_REPLICAS}"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
