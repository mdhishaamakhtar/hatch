# The acceptance audit, applied by scripts/verify.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: hatch-verify
  namespace: hatch
  labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: verify}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hatch, app.kubernetes.io/component: verify}
    spec:
      restartPolicy: Never
      # Lets the image's nonroot user write to the scratch volume, where the
      # archival check exports a partition.
      securityContext: {fsGroup: 65532}
      containers:
        - name: verify
          image: ${VERIFY_IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: hatch-secrets}
          env:
            - {name: SCHEDULER_REPLICAS, value: "${SCHEDULER_REPLICAS}"}
            - {name: TMPDIR, value: /scratch}
          volumeMounts:
            - {name: scratch, mountPath: /scratch}
      volumes:
        - {name: scratch, emptyDir: {}}
